{% extends "admin/base.html" %}
{% block content %}
<h3 class="mb-4">دسته‌بندی خدمات</h3>

<div class="card p-3 mb-4">
    <h5>افزودن دسته‌بندی جدید</h5>
    <form method="POST" class="row g-2">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="col-md-4"><input name="name" class="form-control" placeholder="نام دسته‌بندی مثل زیبایی" required></div>
        <div class="col-md-2"><button class="btn btn-dark w-100">افزودن</button></div>
    </form>
</div>

<table class="table table-bordered table-hover bg-white">
    <thead><tr><th>#</th><th>نام</th><th>تعداد خدمات</th><th>عملیات</th></tr></thead>
    <tbody>
        {% for category in categories %}
        <tr>
            <td>{{ category.id }}</td>
            <td>{{ category.name }}</td>
            <td>{{ category.services | length }}</td>
            <td>
                <form method="POST" action="{{ url_for('admin_panel.delete_service_category', category_id=category.id) }}" onsubmit="return confirm('حذف شود؟ خدمات این دسته به «بدون دسته‌بندی» منتقل می‌شوند.');">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="btn btn-sm btn-outline-danger">حذف</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center">دسته‌بندی‌ای ثبت نشده است</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
